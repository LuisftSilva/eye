name: Automated Portugal Webcam Audit

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Municipalities to process in this run
        required: false
        default: "3"
      municipality_id:
        description: Optional exact municipality id
        required: false
        default: ""
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

concurrency:
  group: webcam-audit-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-audit.txt

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements-audit.txt

      - name: Preflight validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py
          python - <<'PY'
          import json
          from pathlib import Path

          defaults = {
              Path('audit/unassigned-portugal-cameras.json'): [],
              Path('audit/cache/search-cache.json'): {'schema_version': 1, 'entries': {}},
          }
          for path, default in defaults.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              if not path.exists():
                  path.write_text(json.dumps(default, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              json.loads(path.read_text(encoding='utf-8'))

          cycle = json.loads(Path('audit/cycle.json').read_text(encoding='utf-8'))
          assert cycle.get('cycle_id')
          assert cycle.get('started_at')

          import sys
          sys.path.insert(0, 'scripts')
          import webcam_audit
          assert hasattr(webcam_audit, 'AuditCrawler')
          assert hasattr(webcam_audit.AuditCrawler, 'search')
          assert hasattr(webcam_audit.AuditCrawler, 'inspect')
          assert hasattr(webcam_audit.AuditCrawler, 'run_check')
          print(f"Crawler preflight passed for cycle {cycle['cycle_id']}.")
          PY

      - name: Run cached lossless audit
        id: audit
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          AUDIT_DELAY: "0.35"
          AUDIT_CONNECT_TIMEOUT: "5"
          AUDIT_READ_TIMEOUT: "12"
          AUDIT_RETRIES: "1"
          AUDIT_RETRY_BACKOFF: "0.35"
          AUDIT_MAX_PAGE_BYTES: "2500000"
          AUDIT_POSITIVE_CACHE_DAYS: "14"
          AUDIT_EMPTY_CACHE_HOURS: "48"
          AUDIT_MAX_CACHE_ENTRIES: "25000"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p audit/logs
          LIMIT="${{ github.event.inputs.limit }}"
          LIMIT="${LIMIT:-3}"
          MUNICIPALITY="${{ github.event.inputs.municipality_id }}"
          ARGS=(--limit "$LIMIT" --max-results 10)
          if [[ -n "$MUNICIPALITY" ]]; then
            ARGS+=(--municipality-id "$MUNICIPALITY")
          fi

          set +e
          python scripts/run_audit_v4.py "${ARGS[@]}" > audit/logs/latest-console.log 2>&1
          CODE=$?
          set -e
          echo "$CODE" > audit/logs/latest-exit-code.txt

          if [[ -f audit/logs/latest-summary.md ]]; then
            cat audit/logs/latest-summary.md
          fi

          if [[ "$CODE" -ne 0 ]]; then
            echo "Crawler internal failure. Last diagnostic lines:"
            tail -n 100 audit/logs/latest-console.log
            exit "$CODE"
          fi

          echo "Audit completed. External HTTP refusals and timeouts are retained only in the diagnostic artifact."

      - name: Validate current-cycle evidence and update progress
        run: python scripts/update_audit_progress_v2.py

      - name: Validate generated state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('audit/cycle.json'),
              Path('audit/unassigned-portugal-cameras.json'),
              Path('audit/cache/search-cache.json'),
              Path('audit/auto-cameras.json'),
              Path('audit/progress-current.json'),
          ]
          for path in paths:
              if not path.exists():
                  raise SystemExit(f'Missing generated file: {path}')
              json.loads(path.read_text(encoding='utf-8'))
              print(f'Valid: {path}')
          PY

      - name: Add concise audit summary
        if: always()
        shell: bash
        run: |
          if [[ -f audit/logs/latest-summary.md ]]; then
            cat audit/logs/latest-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Audit stopped before diagnostics were generated" >> "$GITHUB_STEP_SUMMARY"
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          def load(path, default):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return default

          cycle = load('audit/cycle.json', {})
          progress = load('audit/progress-current.json', {})
          pending = load('audit/unassigned-portugal-cameras.json', [])
          cache = load('audit/cache/search-cache.json', {'entries': {}})
          print('\n## Persistent state')
          print(f'- Audit cycle: **{cycle.get("cycle_id", "unknown")}**')
          print(f'- Next municipality: **{progress.get("next_municipality", {}).get("municipality", "unknown")}**')
          print(f'- Portugal candidates awaiting exact location: **{len(pending)}**')
          print(f'- Cached searches available for reuse: **{len(cache.get("entries", {}))}**')
          PY

      - name: Upload full diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webcam-audit-diagnostics-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            audit/logs/
            audit/last-automated-run.json
            audit/evidence/
            audit/unassigned-portugal-cameras.json

      - name: Commit durable audit state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "webcam-audit-bot"
          git config user.email "webcam-audit-bot@users.noreply.github.com"

          git add audit/cycle.json audit/evidence audit/auto-cameras.json audit/unassigned-portugal-cameras.json audit/cache/search-cache.json audit/last-automated-run.json audit/progress-current.json audit/municipalities.csv
          git restore --worktree audit/logs 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No durable audit changes to commit."
            exit 0
          fi

          git commit -m "audit: update Portugal webcam discovery state"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after synchronizing main."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Unable to publish durable audit state after three attempts."
          exit 1
