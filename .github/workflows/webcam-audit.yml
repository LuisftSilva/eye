name: Automated Portugal Webcam Audit

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Municipalities to process in this run
        required: false
        default: "3"
      municipality_id:
        description: Optional exact municipality id
        required: false
        default: ""
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: write

concurrency:
  group: webcam-audit-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-audit.txt

      - name: Install dependencies
        run: pip install -r requirements-audit.txt

      - name: Compile crawler before running
        run: |
          python -m py_compile scripts/webcam_audit.py
          python -m py_compile scripts/run_audit_diagnostics.py
          python -m py_compile scripts/run_audit_pro.py
          python -m py_compile scripts/run_audit_ultra.py
          python -m py_compile scripts/run_audit_ultra_fixed.py
          python -m py_compile scripts/run_audit_clean.py
          python -m py_compile scripts/update_audit_progress.py

      - name: Run comprehensive audit with diagnostics
        id: audit
        continue-on-error: true
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          AUDIT_DELAY: "0.6"
          AUDIT_CONNECT_TIMEOUT: "6"
          AUDIT_READ_TIMEOUT: "15"
          AUDIT_RETRIES: "1"
          AUDIT_RETRY_BACKOFF: "0.5"
          AUDIT_MAX_PAGE_BYTES: "3000000"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          LIMIT="${LIMIT:-3}"
          MUNICIPALITY="${{ github.event.inputs.municipality_id }}"
          ARGS=(--limit "$LIMIT" --max-results 10)
          if [[ -n "$MUNICIPALITY" ]]; then
            ARGS+=(--municipality-id "$MUNICIPALITY")
          fi
          python scripts/run_audit_clean.py "${ARGS[@]}"

      - name: Validate evidence and update progress
        if: steps.audit.outcome == 'success'
        run: python scripts/update_audit_progress.py

      - name: Add audit report to GitHub Actions summary
        if: always()
        shell: bash
        run: |
          if [[ -f audit/logs/latest-summary.md ]]; then
            cat audit/logs/latest-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Audit diagnostics missing" >> "$GITHUB_STEP_SUMMARY"
            echo "The diagnostic runner did not create its summary file." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webcam-audit-diagnostics-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            audit/logs/
            audit/last-automated-run.json
            audit/evidence/

      - name: Commit generated evidence and diagnostics
        if: always()
        shell: bash
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "No audit changes to commit."
            exit 0
          fi
          git config user.name "webcam-audit-bot"
          git config user.email "webcam-audit-bot@users.noreply.github.com"
          git add audit/evidence audit/auto-cameras.json audit/last-automated-run.json audit/progress-current.json audit/municipalities.csv audit/logs
          git commit -m "audit: process next Portugal municipalities"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail workflow when crawler failed
        if: steps.audit.outcome != 'success'
        run: |
          echo "The crawler failed. Review the job summary and the uploaded diagnostics artifact."
          exit 1
